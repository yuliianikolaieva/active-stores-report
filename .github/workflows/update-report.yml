name: Update Active Stores report

on:
  schedule:
    # Weekly refresh on Monday ~10:00 Kyiv. GitHub runs scheduled jobs best-effort
    # (often delayed, and worst at :00), so we use an off-peak minute and two times
    # to cover DST + act as mutual backups. The job only commits when data changed,
    # so the extra run is a harmless no-op.
    #   07:07 UTC = 10:07 Kyiv (EEST, summer) / 09:07 (EET, winter)
    #   08:07 UTC = 11:07 Kyiv (EEST, summer) / 10:07 (EET, winter)
    - cron: '7 7 * * 1'
    - cron: '7 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: python fetch_from_dbx.py

      - name: Build report
        run: python build.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto-update report ($(date -u +%Y-%m-%d))"
            git push
          fi
